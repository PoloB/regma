[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "templex"
version = "0.1.0"
description = "Object-based, bidirectional string templating with declarative result types"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "templex contributors" }]
keywords = ["templating", "parsing", "formatting", "paths", "urls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/your-org/templex"
Repository = "https://github.com/your-org/templex"
Issues = "https://github.com/your-org/templex/issues"
Changelog = "https://github.com/your-org/templex/CHANGELOG.md"

# ── Hatch ─────────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/templex"]

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["templex"]
branch = true
omit = ["templex/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

# ── Ruff (lint + format) ──────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []
fixable = ["TC", "E401"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
