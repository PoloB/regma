[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "templex"
version = "0.1.0"
description = "Object-based, bidirectional string templating with declarative result types"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Paul-Emile Buteau", email = "paulemilebuteau@gmail.com" },
]
keywords = ["templating", "parsing", "formatting", "paths", "urls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-benchmark>=5.2.3",
]
lint = [
    "mypy>=1.19.1",
    "ruff>=0.15.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/your-org/templex"
Repository = "https://github.com/your-org/templex"
Issues = "https://github.com/your-org/templex/issues"
Changelog = "https://github.com/your-org/templex/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/templex"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests/"

[tool.coverage]
run.omit = ["tests/*"]
report.exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 89
lint.select = ["ALL"]
lint.ignore = ["COM812"]
lint.fixable = [
    "D202", # black lines after docstring in functions
    "I", # sorting imports
    "F401", # unused imports
    "TC001", # first party imports not in type checking block
    "TC002", # third party imports not in type checking block
    "TC003", # builtin party imports not in type checking block
    "TC004", # imports used at runtime but in type checking block
    "TC005", # empty type checking block
    "RUF022",
    "E501",
]
lint.isort.force-single-line = true
lint.pydocstyle.convention = "google"
format.skip-magic-trailing-comma = true
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["S101"]
"tests/**/test_*.py" = ["S101"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
strict = true
ignore_missing_imports = true
