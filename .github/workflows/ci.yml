name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: "test / py${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-caching: true
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.os }}

      - name: Install dependencies
        run: uv sync --frozen --group test
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest tests/

  # ── Lint (ruff + mypy) ───────────────────────────────────────────────────────
  lint:
    name: "lint"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen --group lint
        env:
          UV_PYTHON: "3.13"

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

  # ── Coverage ─────────────────────────────────────────────────────────────────
  coverage:
    name: "coverage"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen --group test
        env:
          UV_PYTHON: "3.13"

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # remove if repo is public
          files: coverage.xml
          fail_ci_if_error: true

  # ── Benchmarks ───────────────────────────────────────────────────────────────
  benchmark:
    name: "benchmark"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen --group test --group test
        env:
          UV_PYTHON: "3.13"

      - name: Run benchmarks
        run: uv run pytest tests/ --benchmark-only --benchmark-json=benchmark_result.json

      - name: Store and compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: benchmark_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-on-alert: true
          alert-threshold: "150%"
          fail-on-alert: true
          benchmark-data-dir-path: dev/bench/3.12