name: Publish

on:
  release:
    types: [published]

jobs:

  # ── Validate release tag matches package version ──────────────────────────────
  validate:
    name: "validate tag"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Check tag matches version in pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ($TAG) does not match pyproject.toml version ($PKG)"
            exit 1
          fi
          echo "Tag and package version match: $PKG"

  # ── Full CI must pass before publishing ──────────────────────────────────────
  ci:
    name: "ci"
    uses: ./.github/workflows/ci.yml

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: "build"
    runs-on: ubuntu-latest
    needs: [validate, ci]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Publish to PyPI ───────────────────────────────────────────────────────────
  publish-pypi:
    name: "publish / pypi"
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi

    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Attach build artifacts to the GitHub Release ──────────────────────────────
  attach-artifacts:
    name: "attach artifacts"
    runs-on: ubuntu-latest
    needs: [publish-pypi]

    permissions:
      contents: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Attach sdist and wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*